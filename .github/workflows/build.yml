name: Build Windows EXE
 
on:
  workflow_dispatch:
  push:
    paths:
      - "multi_step_autoclicker.py"
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install pyautogui pyperclip pyinstaller
 
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name MultiStepAutoClicker multi_step_autoclicker.py
 
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MultiStepAutoClicker
          path: dist/MultiStepAutoClicker.exe
 
